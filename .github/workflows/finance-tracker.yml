name: Launch and Test

on: 
  workflow_dispatch: 
  push:
    branches:
      - new-workflow-features
  pull_request:
    branches:
      - new-workflow-features

jobs:
  launch:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}

    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false

    - name: Start services
      run: docker compose up -d
    
    # - name: Ping backend from frontend
    #   run: docker exec finance-tracker-ft-frontend-1 ping -c 3 ft-backend

    - name: Check from outside
      run: curl -v http://localhost:8080/api/v1/health
    # - name: Curl health endpoint from frontend directly - работает 
    #   run: docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health
    # - name: Curl health endpoint from frontend through nginx -работает
    #   run: docker exec finance-tracker-ft-frontend-1 curl -v http://ft-frontend:80/api/v1/health
      # or run: docker exec finance-tracker-ft-frontend-1 curl -v http://localhost:80/api/v1/health
      


    # - name: Try connect
    #   run: |
    #     docker exec finance-tracker-ft-frontend-1 nc -zv ft-backend 8000 
    #     docker exec finance-tracker-ft-frontend-1 ping -c 3 ft-backend
    #     docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health
        
    #     echo "TRY FROM THE OUTSIDE"
    #     curl -v http://localhost:8080/api/v1/health 
        
    - name: Collect logs
      uses: jwalton/gh-docker-logs@v2
      with:
        dest: './logs'

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: 
        name: logs
        path: ./logs



