name: Launch and Test

on: 
  workflow_dispatch: 
  push:
    branches:
      - new-workflow-features
  pull_request:
    branches:
      - new-workflow-features

jobs:
  launch:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}

    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false

    - name: Start services
      run: docker compose up -d

    - name: Try connect
      run: |
        ls /etc/nginx/conf.d > './logs/personal/conf-dir-ls.txt'
        cat /etc/nginx/conf.d/default.conf > './logs/personal/default-conf-cat.txt'
        ss -tulpn

        echo "TRY FROM THE OUTSIDE"
        curl -v http://localhost:8080/favicon.ico
        curl -v http://localhost:8080/api/v1/health 
        
        
    - name: Collect logs
      uses: jwalton/gh-docker-logs@v2
      with:
        dest: './logs'

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: 
        name: logs
        path: ./logs



