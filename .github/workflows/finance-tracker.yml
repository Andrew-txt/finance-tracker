# echo "NETWORK"
# docker run --rm --network finance-tracker_ft-network curlimages/curl -f http://ft-backend:8000/api/v1/health


name: Launch and Test

on: 
  workflow_dispatch: 
  push:
    branches:
      - new-workflow-features
  pull_request:
    branches:
      - new-workflow-features

jobs:
  launch:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}

    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false

    - name: Start services
      run: docker compose up -d

    - name: Try connect
      run: |
        ss -tulpn
        echo "CHECK CONTAINERS NETWORKS"
        docker inspect finance-tracker-ft-frontend-1 --format='{{.NetworkSettings.Networks}}'
        docker inspect finance-tracker-ft-backend-1 --format='{{.NetworkSettings.Networks}}'

        

        echo "TRY FROM THE OUTSIDE"
        curl -v http://127.0.0.1:80/api/v1/health
        curl -v http://localhost/api/v1/health
        
    - name: Collect logs
      uses: jwalton/gh-docker-logs@v2
      with:
        dest: './logs'

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: 
        name: logs
        path: ./logs



