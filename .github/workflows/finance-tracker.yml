name: Launch and Check

on: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  launch-and-check: 
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
        persist-credentials: false
    
    - name: Start services
      run: docker compose up -d
        
    - name: Healthcheck
      run: curl -f http://localhost:8080/api/v1/health

    - name: Collect logs
      uses: step-security/gh-docker-logs@561ab0d8664f002c3eb106f4cce2799cdc4510d7
      with:
        dest: './logs'

    - name: Upload logs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: 
        name: logs
        path: ./logs
