# сделать новую ветку чтоб протестировать workflow
# docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health -- не видит: connection refused
# echo "NETWORK"

# docker exec finance-tracker-ft-frontend-1 nslookup ft-backend   -- server cant find
name: Launch and Test

on: 
  workflow_dispatch: 
  push:
    branches:
      - new-workflow-features
  pull_request:
    branches:
      - new-workflow-features

jobs:
  launch-without-ping: # cannot connect to server
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}

    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false

    - name: Start services
      run: docker compose up -d

    - name: Curl health endpoint from frontend directly 
      run: docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health

    - name: Collect logs
      uses: jwalton/gh-docker-logs@v2
      with:
        dest: './logs'

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: 
        name: logs
        path: ./logs
        
      
  launch-with-ping: # works
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
    
    - name: Start services
      run: docker compose up -d
      
    - name: Ping backend from frontend (1)
      run: docker exec finance-tracker-ft-frontend-1 ping -c 3 ft-backend
      
    - name: Curl health endpoint from frontend directly (1)  
      run: docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health


  launch-with-ping-out: # works
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
    
    - name: Start services
      run: docker compose up -d
      
    - name: Ping backend from frontend (2)
      run: docker exec finance-tracker-ft-frontend-1 ping -c 3 ft-backend
      
    - name: Check from outside (2) 
      run: curl -v http://localhost:8080/api/v1/health


  launch-without-ping-out: # connection reset by peer
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
    
    - name: Start services
      run: docker compose up -d
      
    - name: Check from outside (3) 
      run: curl -v http://localhost:8080/api/v1/health


  launch-with-outer-ping-out: 
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
    
    - name: Start services
      run: docker compose up -d
  
    - name: Ping frontend
      run: ping -c 3 http://localhost:8080/api/v1/health
    
    - name: Check from outside (3) 
      run: curl -v http://localhost:8080/api/v1/health


  launch-with-outer-ping: 
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
    
    - name: Checkout Compose file
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          docker-compose.yml
        sparse-checkout-cone-mode: false
    
    - name: Start services
      run: docker compose up -d
  
    - name: Ping frontend
      run: ping -c 3 http://localhost:8080/api/v1/health
      
    - name: Curl health endpoint from frontend directly (3)  
      run: docker exec finance-tracker-ft-frontend-1 curl -v http://ft-backend:8000/api/v1/health

      
