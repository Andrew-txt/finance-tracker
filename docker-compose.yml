services:
  ft-backend:
    image: andrewtxt/docker.repo:ft-backend-1.0
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - sqlite_data:/app/sqlite_data           
    networks:
      - ft-network
    expose:
      - "8000"

  ft-frontend:
    image: andrewtxt/docker.repo:ft-frontend-1.0
    ports:
      - "8080:80"
    expose:
      - "80"
    depends_on:
      ft-backend: 
        condition: service_healthy
    networks:
      - ft-network

volumes:
  sqlite_data:

networks:
  ft-network:
    driver: bridge