# Nginx configuration file for vue frontend docker container
server {
    listen       80;
    server_name  ft-frontend;  

    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ft-backend:8000/api/;
    }

    location /auth/ {
        proxy_pass http://ft-backend:8000/auth/;
    }
}